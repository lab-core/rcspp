name: Coverage Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:  # allows ci-full.yml to call this as a reusable sub-workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  coverage-gate:
    name: Coverage gate (ubuntu / Release / py3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y build-essential cmake

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install gcovr pytest -r tests/python/requirements.txt

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_PYTHON=ON \
            -DUSE_TESTS=ON \
            -DUSE_COVERAGE=ON \
            "-DCMAKE_CXX_CLANG_TIDY="

      - name: Build
        run: cmake --build build --parallel

      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Python tests (coverage gate)
        working-directory: tests/python
        run: |
          pytest -v --tb=short \
            --cov=rcspp --cov-config=.coveragerc \
            --cov-report=term-missing --cov-fail-under=90

      - name: C++ coverage gate
        run: |
          mkdir -p coverage
          gcovr --config gcovr.cfg build
          python3 scripts/check_cpp_coverage.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y build-essential cmake

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: pip install pytest -r tests/python/requirements.txt

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_PYTHON=ON \
            -DUSE_TESTS=OFF \
            -DUSE_COVERAGE=OFF \
            "-DCMAKE_CXX_CLANG_TIDY="

      - name: Build _core
        run: cmake --build build --parallel --target _core

      - name: Python tests
        working-directory: tests/python
        run: pytest -v --tb=short
