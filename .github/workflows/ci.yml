name: Coverage Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:  # allows ci-full.yml to call this as a reusable sub-workflow

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  coverage-gate:
    name: Coverage Gate (ubuntu / Release / py3.14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y build-essential cmake

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install gcovr pytest -r tests/python/requirements.txt

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_PYTHON=ON \
            -DUSE_TESTS=ON \
            -DUSE_COVERAGE=ON \
            "-DCMAKE_CXX_CLANG_TIDY="

      - name: Build
        run: cmake --build build --parallel

      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Python tests (coverage gate)
        working-directory: tests/python
        run: |
          pytest -v --tb=short \
            --cov=rcspp --cov-config=.coveragerc \
            --cov-report=term-missing --cov-fail-under=90

      - name: C++ coverage gate
        run: |
          mkdir -p coverage
          gcovr --config gcovr.cfg build
          # Gate 1: overall line coverage >= 85%.
          # Gate 2: no function with >= MIN_FN_LINES instrumented lines may be
          #         completely uncovered (execution_count == 0).  This catches
          #         new non-trivial code added without any test, while ignoring
          #         one-liner helpers and GCC probe artifacts.
          python3 - <<'PYEOF'
          import json, sys
          from collections import defaultdict

          MIN_FN_LINES = 10   # instrumented lines; functions smaller than this are ignored
          LINE_THRESHOLD = 85  # minimum overall line-coverage percentage

          # ── Load reports ──────────────────────────────────────────────────────
          with open("coverage/cpp.json") as f:
              data = json.load(f)

          # ── Gate 1: overall line coverage ────────────────────────────────────
          total_lines = covered_lines = 0
          file_lines = {}  # filename -> {lineno: hits}
          for file_data in data.get("files", []):
              fname = file_data["filename"]
              lines = {l["line_number"]: l["count"] for l in file_data.get("lines", [])}
              file_lines[fname] = lines
              total_lines += len(lines)
              covered_lines += sum(1 for h in lines.values() if h > 0)

          pct = covered_lines / total_lines * 100 if total_lines else 0

          print("\n=== C++ line coverage by file ===")
          for fname, lines in sorted(file_lines.items()):
              uncov = sorted(ln for ln, h in lines.items() if h == 0)
              if uncov:
                  cov_pct = (len(lines) - len(uncov)) / len(lines) * 100
                  tail = "..." if len(uncov) > 20 else ""
                  print(f"  {fname}: {cov_pct:.1f}%  missing={uncov[:20]}{tail}")
          print(f"\nTotal: {covered_lines}/{total_lines} = {pct:.1f}%")

          # ── Gate 2: no large uncovered function ──────────────────────────────
          large_uncovered = []
          for file_data in data.get("files", []):
              fname = file_data["filename"]
              lines = file_lines[fname]
              fns = sorted(file_data.get("functions", []), key=lambda f: f.get("start_line", 0))
              for i, fn in enumerate(fns):
                  if fn.get("execution_count", 0) != 0:
                      continue
                  start = fn.get("start_line", 0)
                  end = fns[i + 1].get("start_line", max(lines) + 1) - 1 if i + 1 < len(fns) else max(lines, default=start)
                  fn_line_count = sum(1 for ln in lines if start <= ln <= end)
                  if fn_line_count >= MIN_FN_LINES:
                      large_uncovered.append(
                          f"  {fname}: '{fn.get('name', '?')}' "
                          f"lines {start}-{end} ({fn_line_count} instrumented lines, 0 calls)"
                      )

          failed = False
          if pct < LINE_THRESHOLD:
              print(f"\nFAIL: line coverage {pct:.1f}% < required {LINE_THRESHOLD}%")
              failed = True
          if large_uncovered:
              print(f"\nFAIL: {len(large_uncovered)} function(s) with >={MIN_FN_LINES} "
                    f"instrumented lines are completely uncovered:")
              for msg in large_uncovered:
                  print(msg)
              failed = True
          if not failed:
              print(f"\nPASS: {pct:.1f}% line coverage, no large uncovered functions.")
          sys.exit(1 if failed else 0)
          PYEOF

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
