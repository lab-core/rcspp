name: publish-pypi

on:
  push:
    branches:
      - python-params
      - package-pypi
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target package index'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: cp311-* cp312-*
          CIBW_SKIP: pp* *-musllinux_* *-win32 *_i686
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT_WINDOWS: CMAKE_GENERATOR="Visual Studio 17 2022" CMAKE_GENERATOR_PLATFORM=x64

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to ${{ inputs.repository || 'testpypi' }}
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository || 'testpypi' }}
    permissions:
      id-token: write

    steps:
      - name: Validate publish target
        run: |
          echo "Selected ref: ${{ github.ref }}"
          if [ "${{ inputs.repository || 'testpypi' }}" = "pypi" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "PyPI publishing is restricted to refs/heads/main."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Publish to TestPyPI
        if: ${{ (inputs.repository || 'testpypi') == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
