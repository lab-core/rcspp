name: CI Full

# Test matrix on Linux, macOS and Windows (see the test job), plus wheel/sdist builds.
# Triggered manually ("Run workflow") or by adding the `run-ci` label to a pull request (remove
# and add it again to re-run). The coverage gate also runs automatically on push/PR to main
# (ci.yml).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  # ── Coverage gate (reuses ci.yml definition — no duplication) ─────────────
  coverage:
    name: Coverage Gate
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci'
    uses: ./.github/workflows/ci.yml

  test:
    name: Test / ${{ matrix.os }} / ${{ matrix.build-type }} / py${{ matrix.python-version }}${{ matrix.suites == 'python' && ' / Python only' || '' }}
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      # Per OS: the C++ and Python suites on the newest Python, and the Python suite alone on the
      # oldest supported one (a failure specific to one Python version shows at either end
      # first); the C++ executable does not depend on the Python version, so it is built once.
      # Plus the C++ suite in Debug on Windows, where MSVC's checked iterators catch what the
      # other standard libraries do not. The coverage gate already runs the asserts on Linux.
      matrix:
        include:
          - {os: ubuntu-latest, build-type: Release, python-version: '3.14', suites: all}
          - {os: ubuntu-latest, build-type: Release, python-version: '3.11', suites: python}
          - {os: macos-latest, build-type: Release, python-version: '3.14', suites: all}
          - {os: macos-latest, build-type: Release, python-version: '3.11', suites: python}
          - {os: windows-latest, build-type: Release, python-version: '3.14', suites: all}
          - {os: windows-latest, build-type: Release, python-version: '3.11', suites: python}
          - {os: windows-latest, build-type: Debug, python-version: '3.14', suites: cpp}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y build-essential cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang"   >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          # The C++-only job installs nothing with pip, and an empty pip cache fails the save.
          cache: ${{ matrix.suites != 'cpp' && 'pip' || '' }}
          cache-dependency-path: tests/python/requirements.txt

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DUSE_PYTHON=${{ matrix.suites != 'cpp' && 'ON' || 'OFF' }} \
            -DUSE_TESTS=${{ matrix.suites != 'python' && 'ON' || 'OFF' }} \
            "-DCMAKE_CXX_CLANG_TIDY="

      - name: Build
        # One compile per core. A bare --parallel lets make start every translation unit at
        # once; on the 3-core, 7 GB macOS runners the heavy template TUs then fight for memory.
        run: cmake --build build --config ${{ matrix.build-type }} --parallel ${{ runner.os == 'macOS' && 3 || 4 }}

      - name: C++ tests
        if: matrix.suites != 'python'
        # Each test is its own process; four at a time fill the runner's cores.
        run: ctest --test-dir build -C ${{ matrix.build-type }} --output-on-failure --parallel 4

      - name: Install Python test dependencies
        if: matrix.suites != 'cpp'
        run: pip install pytest -r tests/python/requirements.txt

      - name: Python tests
        if: matrix.suites != 'cpp'
        working-directory: tests/python
        run: pytest -v --tb=short

  build_wheels:
    name: Wheels / ${{ matrix.os }}
    needs: [coverage, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    needs: [coverage, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --upgrade build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
