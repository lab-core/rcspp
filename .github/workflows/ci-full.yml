name: CI Full

# Full test matrix (all OS × build types × Python versions) plus wheel/sdist builds.
# Triggered manually ("Run workflow") or by posting `/run-ci` in any PR comment.
# The coverage gate also runs automatically on push/PR to main (ci.yml).
on:
  workflow_dispatch:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  # ── Coverage gate (reuses ci.yml definition — no duplication) ─────────────
  coverage:
    name: Coverage Gate
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/run-ci'))
    uses: ./.github/workflows/ci.yml

  test:
    name: Test / ${{ matrix.os }} / ${{ matrix.build-type }} / py${{ matrix.python-version }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/run-ci'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [Debug, Release]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        exclude:
          # Debug builds don't run Python tests — only one Python version needed
          - build-type: Debug
            python-version: '3.11'
          - build-type: Debug
            python-version: '3.12'
          - build-type: Debug
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          # When triggered by a PR comment, check out the PR head branch
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y build-essential cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang"   >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DUSE_PYTHON=ON \
            -DUSE_TESTS=ON \
            "-DCMAKE_CXX_CLANG_TIDY="

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: C++ tests
        run: ctest --test-dir build -C ${{ matrix.build-type }} --output-on-failure

      - name: Install Python test dependencies
        if: matrix.build-type == 'Release'
        run: pip install pytest -r tests/python/requirements.txt

      - name: Python tests
        if: matrix.build-type == 'Release'
        working-directory: tests/python
        run: pytest -v --tb=short

  build_wheels:
    name: Wheels / ${{ matrix.os }}
    needs: [coverage, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    needs: [coverage, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --upgrade build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
