name: Pre-commit

on:
  push:
    branches: [ main ]
  # Every base branch, so a PR stacked on another feature branch is tested too.
  pull_request:

# A newer push to the same pull request cancels the run in progress. A push to main gets a group
# of its own, so it never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # ✅ allow pushing back

jobs:
  pre-commit:
    # A named image, not ubuntu-latest: when "latest" moves on, cppcheck and the system headers
    # clang-tidy reads change with it. Moving to a newer image is a change of its own.
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      # -------------------------
      # Checkout the repo
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history, so pre-commit can diff the pull request against its base.
          fetch-depth: 0

      # -------------------------
      # Setup Python (for Python hooks)
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # -------------------------
      # Install dependencies
      # -------------------------
      # clang-format, clang-tidy and cpplint come from .github/lint/requirements.txt, at the
      # versions pinned there, not from the image, whose versions change when it is updated.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cppcheck
          python -m pip install --upgrade pip
          pip install -r .github/lint/requirements.txt
          clang-format --version
          clang-tidy --version
          cpplint --version

      # -------------------------
      # use pre-commit action to run the hooks
      # -------------------------
      # A pull request checks the files it changes; a push to main checks every file, so a hook
      # upgrade that flags untouched code still shows up there. A pull request that changes the
      # linters or their configuration (a Dependabot upgrade, say) checks every file too, so it
      # shows what the new versions flag before it is merged.
      - name: Choose the files to check
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          linters='^(\.pre-commit-config\.yaml|\.clang-format|\.clang-tidy|\.clang-tidy-naming|\.github/lint/requirements\.txt|\.github/workflows/pre-commit\.yml)$'
          if [ "$EVENT" != pull_request ]; then
            echo "args=--all-files" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" | grep -qE "$linters"; then
            echo "The linters or their configuration change: checking every file."
            echo "args=--all-files" >> "$GITHUB_OUTPUT"
          else
            echo "args=--from-ref $BASE --to-ref $HEAD" >> "$GITHUB_OUTPUT"
          fi

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: ${{ steps.scope.outputs.args }}

      # -------------------------
      # Naming conventions
      # -------------------------
      # .clang-tidy-naming checks the conventions of AGENT.md over the whole library, and fails the
      # job on any name that breaks them. It is not a pre-commit hook, whose clang-tidy runs with
      # -fix. It runs even when the hooks fail, so one run reports both.
      - name: Naming conventions
        if: always()
        run: clang-tidy --config-file=.clang-tidy-naming cpp/rcspp/rcspp.hpp -- -xc++ -std=c++20 -Icpp
