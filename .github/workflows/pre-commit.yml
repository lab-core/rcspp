name: Pre-commit

on:
  push:
    branches: [ main ]
  # Every base branch, so a PR stacked on another feature branch is tested too.
  pull_request:

# A newer push to the same pull request cancels the run in progress. A push to main gets a group
# of its own, so it never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # ✅ allow pushing back

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -------------------------
      # Checkout the repo
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The whole history, so pre-commit can diff the pull request against its base.
          fetch-depth: 0

      # -------------------------
      # Setup Python (for Python hooks)
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy clang-format cppcheck
          python -m pip install --upgrade pip
          pip install cpplint

      # -------------------------
      # use pre-commit action to run the hooks
      # -------------------------
      # A pull request checks the files it changes; a push to main checks every file, so a hook
      # upgrade that flags untouched code still shows up there.
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--all-files' }}

      # -------------------------
      # Naming conventions, report only
      # -------------------------
      # .clang-tidy-naming checks the conventions of AGENT.md over the whole library. It reports
      # and never fails the job: a few older names (MAX_INT, the FNV_* constants, ...) do not follow
      # them yet. It is not a pre-commit hook, whose clang-tidy runs with -fix.
      - name: Naming conventions (report only)
        if: always()
        continue-on-error: true
        run: clang-tidy --config-file=.clang-tidy-naming cpp/rcspp/rcspp.hpp -- -xc++ -std=c++20 -Icpp
