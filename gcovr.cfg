# gcovr configuration for the rcspp C++ line-coverage gate.
#
# Reports combined coverage from BOTH test suites (ctest -> tests-rcspp and
# pytest -> _core) over the two required source roots only. Run after both
# suites have produced .gcda, e.g.:
#   gcovr --config gcovr.cfg --gcov-executable gcov-14 build
#
# No inline GCOVR_EXCL markers are used in the binding files. The CI gate
# uses a size-based function check (see ci.yml) instead of 100% line coverage.

filter = cpp/rcspp/
filter = python/bindings/

# No fail-under here — the CI gate runs a Python post-processing script that
# computes unique-source-line coverage (merging all template instantiations of
# the same source line via XML parsing) and fails if < 100%.

exclude-throw-branches = yes
exclude-unreachable-branches = yes

# pybind11 module-init boilerplate: py::arg(...) registrations and
# py::call_guard / py::keep_alive / py::return_value_policy lines are executed
# at import time and never get independent gcov instrumentation probes.
# Maintaining per-line GCOVR_EXCL_LINE is brittle (clang-format shifts them);
# a single pattern here covers all instances across all binding files.
exclude-lines-by-pattern = ^\s*py::(arg|call_guard|keep_alive|return_value_policy)\b

# Template instantiations of the same function can appear at different line
# numbers in different compilation units (clang/macOS). Use 'separate' locally
# to avoid the "Got function on multiple lines" merge error on macOS.
# The CI gate (Linux/GCC) overrides this with --merge-mode-functions=merge-use-line-min
# so per-compilation-unit duplicates are folded into one record (GCC always
# records the definition site consistently, so line disagreements never occur).
merge-mode-functions = separate

print-summary = yes
sort = uncovered-number

# Reports written under coverage/ (create the dir before running).
txt = coverage/cpp.txt
html-details = coverage/cpp.html
xml = coverage/cpp.xml
json = coverage/cpp.json
root = .
