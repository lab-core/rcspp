[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "rcspp"
version = "0.0.2.dev1"
description = "Resource Constrained Shortest Path Problem library with C++ and Python bindings."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Laboratory for Combinatorial Optimization in Real-time Environment" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "networkx>=3,<4",
]

[project.urls]
Homepage = "https://github.com/lab-core/rcspp"
Repository = "https://github.com/lab-core/rcspp"
Issues = "https://github.com/lab-core/rcspp/issues"

[tool.scikit-build]
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
cmake.args = [
  "-DUSE_PYTHON=ON",
  "-DUSE_TESTS=OFF",
  "-DUSE_VRP=OFF",
]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*"]
skip = ["pp*", "*-musllinux_*", "*-win32", "*_i686"]
build-verbosity = 1
test-command = "python -c \"import rcspp; from rcspp.graph import ResourceGraph\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
environment = { CMAKE_GENERATOR = "Visual Studio 17 2022", CMAKE_GENERATOR_PLATFORM = "x64" }

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = ".git,__pycache__,build,dist,venv"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["rcspp"]
