[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "rcspp"
version = "0.0.2.dev1"
description = "Resource Constrained Shortest Path Problem library with C++ and Python bindings."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Laboratory for Combinatorial Optimization in Real-time Environment" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "networkx>=3,<4",
  # rcspp.pricing_pool imports numpy, and column generation works on numpy arrays.
  "numpy>=1.24",
]

[project.optional-dependencies]
# The master solvers over a model the user builds with these packages.
highspy = ["highspy>=1.15"]
gurobipy = ["gurobipy>=13"]

[project.urls]
Homepage = "https://github.com/lab-core/rcspp"
Repository = "https://github.com/lab-core/rcspp"
Issues = "https://github.com/lab-core/rcspp/issues"

[tool.scikit-build]
cmake.version = ">=3.26"
build-dir = "build/{wheel_tag}"
cmake.args = [
  "-DUSE_PYTHON=ON",
  "-DUSE_TESTS=OFF",
  "-DUSE_VRP=OFF",
  # The column generation example stays out of the wheel, whatever the environment sets.
  "-DUSE_COLUMN_GENERATION_EXAMPLE=OFF",
]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*"]
skip = ["pp*", "*-musllinux_*", "*-win32", "*_i686"]
build-verbosity = 1
test-command = "python -c \"import rcspp; from rcspp.graph import ResourceGraph\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# No generator pin: CMake picks the newest Visual Studio, and the platform follows the target
# Python.

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = ".git,__pycache__,build,dist,venv"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["rcspp"]

[tool.pyright]
# Strict, as the editors' Pylance; the package is read from the sources, its compiled core from
# the virtual environment (whose stubs sit next to the sources, hence no missing-source warning).
typeCheckingMode = "strict"
extraPaths = [
  "python/src",
  "tests/python",
  "examples/column_generation/python",
  "examples/column_generation/tests/python",
]
# The stubs of the column generation example's bindings (rcspp._core.cpp_column_generation, built
# with USE_COLUMN_GENERATION_EXAMPLE): kept in the example; pyright reads them with rcspp's own
# stubs in python/src/rcspp/_core.
stubPath = "examples/column_generation/python/typings"
venvPath = "."
venv = ".venv"
exclude = ["build*", "**/__pycache__", ".venv", "venv", "third_party"]
reportMissingModuleSource = false
