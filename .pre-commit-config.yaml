default_language_version:
  python: python3.13

repos:
  # -------------------------
  # Pre-commit core hooks
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(cpp|python|tests|examples)/.*
      - id: end-of-file-fixer
        files: ^(cpp|python|tests|examples)/.*
      - id: mixed-line-ending
        files: ^(cpp|python|tests|examples)/.*
      - id: check-added-large-files
        files: ^(cpp|python|tests|examples)/.*

  # -------------------------
  # Python Formatter: Black
  # -------------------------
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        name: Black Python Formatter
        files: ^(python|tests|examples/column_generation)/.*\.pyi?$
        additional_dependencies: []

  # -------------------------
  # Python Import Sorter: isort
  # -------------------------
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        name: Python Import Sorter
        files: ^(python|tests|examples/column_generation)/.*\.pyi?$

  # -------------------------
  # Python Linter: flake8
  # -------------------------
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: Python Linter
        files: ^(python|tests|examples/column_generation)/.*\.pyi?$
        # Naming checks; .flake8 selects their codes (N, A).
        additional_dependencies: [pep8-naming==0.15.1, flake8-builtins==3.2.0]

  # -------------------------
  # Bandit
  # -------------------------
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        files: ^(python|tests|examples/column_generation)/.*\.py$
        args: ["-ll"]

  # -------------------------
  # docformatter
  # -------------------------
  #- repo: https://github.com/Quantco/pre-commit-mirrors-docformatter
  #  rev: 1.7.5
  #  hooks:
  #    - id: docformatter-conda
  #      args: [--in-place, --black]
  #      files: ^(python|tests)/.*\.py$

  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.7  # Use latest release, check https://github.com/PyCQA/docformatter/releases for updates
    hooks:
    - id: docformatter
      args: ["--in-place", "--black"]
      files: ^(python|tests)/.*\.py$

  # # -------------------------
  # # numpydoc-validation
  # # -------------------------
  # - repo: https://github.com/numpy/numpydoc
  #   rev: v1.6.0
  #   hooks:
  #     - id: numpydoc-validation
  #       files: ^(python|tests)/.*\.py$

  # -------------------------
  # Markdownlint
  # -------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        files: .*\.md$
        exclude: ^(build|build_[^/]+)/
        args: ["--fix"]

  # -------------------------
  # Names retired by renames
  # -------------------------
  # The old spellings of the names that renames replaced (#56, #59), so that a rebased branch cannot
  # bring them back. CHANGELOG.md lists them on purpose, and is not checked. When you rename a
  # public name, add the old one here. Short template parameters (Dir, LC, R) are left to review.
  - repo: local
    hooks:
      - id: retired-names
        name: Names retired by renames
        language: pygrep
        files: ^(cpp|python|tests|examples|docs)/|^(AGENT|README)\.md$
        entry: 'BackwardKind|backward_kind|BackwardForm|backward_form|[Bb]ackward form|\bThresholdForm|TranslationThresholdForm|ArcEndpointsForm|DisjointJoinForm|\b(threshold|arc_endpoints|join)_form\b|CriticalRC|ClockResourceType|FwdContainer|BwdContainer|CostRC\b|SelectCostRC|ContainDominanceFunction|InclusionDominanceFunction|SubtractExtensionFunction|(contain|inclusion)_dominance_function|subtract_extension_function|forbidden_tabu|range_buckets|suggest_range|stop_after_X_solutions|num_max_phases|num_labels_to_extend_by_node|prune_based_on_upper_bound|track_modifications|get_labels_at_sinks|process_feasibility|prepareNextPhase|connectivityMatrix|SimpleFrontier|\bBackwardSimple\b|CostForm|cost_form|backward_reversed|DeclaresDirectionalResourceKind|AlgorithmStatus::(COMPLETE|TIMEOUT|MAX_SOLUTIONS|MAX_PHASES|INTERRUPTED|MEMORY_LIMIT)|ComponentTypeIndex_v|ComponentInitializerTypeTuple_t'
      - id: retired-python-names
        name: Python names retired by renames
        language: pygrep
        # Keywords and parameters only: origin_id stays a fine name for a local variable.
        files: \.pyi?$|^docs/python/.*\.md$
        entry: '\b(col_ids|basis_ids|col_costs|col_indices|col_values|row_starts|row_coefs)\b|\b(origin_id|destination_id)\s*(:|=(?!=))'

  # -------------------------
  # Commit message hooks
  # -------------------------
  - repo: https://github.com/JangasCodingplace/commit-prefix-pre-commit
    rev: v0.0.3-beta
    hooks:
      - id: commit-prefix
        stages: [commit-msg]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # -------------------------
  # C++ all in one
  # -------------------------
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      # -------------------------
      # Clang Format
      # -------------------------
      - id: clang-format
        files: ^(cpp|python|tests|examples)/.*\.(cpp|hpp|c|h)$
        args:
          - -i
          - -style=file

      # -------------------------
      # Clang Tidy
      # -------------------------
      - id: clang-tidy
        # The core library and the column generation example's layer.
        files: ^(cpp|examples/column_generation/cpp)/rcspp/.*\.(cpp|hpp)$
        # The example's master solvers need their solver's headers, which these arguments do not
        # give; the build lints them (CMAKE_CXX_CLANG_TIDY) when they are built.
        exclude: ^examples/column_generation/cpp/rcspp/column_generation/(gurobi|highs)/
        pass_filenames: true
        args:
          - -fix
          # - -fix-errors
          - -extra-arg=-I
          - -extra-arg=cpp
          - -extra-arg=-I
          - -extra-arg=examples/column_generation/cpp

      # -------------------------
      # Cppcheck
      # -------------------------
      - id: cppcheck
        entry: cppcheck
        files: ^(cpp|examples/column_generation/cpp)/rcspp/.*\.(cpp|hpp|c|h)$
        # As clang-tidy.
        exclude: ^examples/column_generation/cpp/rcspp/column_generation/(gurobi|highs)/
        args:
          - --enable=all
          - --inconclusive
          - --std=c++20
          - --suppress=missingIncludeSystem
          - --suppress=unusedFunction
          - --suppress=unusedStructMember
          - -I
          - cpp
          - -I
          - examples/column_generation/cpp

      # -------------------------
      # Cpplint
      # -------------------------
      - id: cpplint
        files: ^(cpp|examples/column_generation/cpp)/rcspp/.*\.(cpp|hpp|c|h)$
        args:
          - --linelength=100
          - --filter=-whitespace/indent
