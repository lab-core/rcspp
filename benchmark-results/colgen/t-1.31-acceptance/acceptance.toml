# subset: the C++ layers, simple forward: plain, buckets, preprocessing off.
[[matrix]]
layer = ["cpp-bindings", "cpp-native"]
master = ["highs"]
instance = ["C101_25", "R201_25", "RC201_12"]
graph = [{}, { relaxation = "ng", ng_size = 8 }]
"pricing.stages" = [[{ algorithm = "simple" }], [{ algorithm = "simple", bucket_width = 20, bucket_resource = "time" }]]

[[matrix]]
layer = ["cpp-bindings", "cpp-native"]
master = ["highs"]
instance = ["C101_25", "R201_25", "RC201_12"]
graph = [{}, { relaxation = "ng", ng_size = 8 }]
"pricing.preprocess" = [false]

# small: C101_10 (ten customers), every layer: none <= ng 8 <= ng 10 = elementary.
[[matrix]]
layer = ["package"]
master = ["highspy"]
instance = ["C101_10"]
graph = [{}, { relaxation = "ng", ng_size = 8 }, { relaxation = "ng", ng_size = 10 }, { relaxation = "elementary" }]

[[matrix]]
layer = ["cpp-bindings", "cpp-native"]
master = ["highs"]
instance = ["C101_10"]
graph = [{}, { relaxation = "ng", ng_size = 8 }, { relaxation = "ng", ng_size = 10 }, { relaxation = "elementary" }]

