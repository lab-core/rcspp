[benchmark]
processes = 1
repeats = 3
timeout = 3600.0
machine = "home-server"
logs = true

[[runs]]
name = "R201-package-highspy-tabu-first-single-customer-column_generation_ad8532"
layer = "package"

[runs.instance]
type = "solomon"
name = "R201"

[runs.master]
type = "highspy"

[runs.master.parameters]

[runs.pricing]
stages = [
    { algorithm = "tabu", max_solutions = 20, max_iterations = 1000 },
    { algorithm = "simple" },
]

[runs.start]
type = "single-customer"

[runs.graph]

[runs.column_generation]
timeout_s = 3300.0
threads = 1

[runs.integer]
solve = true
timeout_s = 60.0
column_type = "binary"

[runs.statistics]
process = true
solution = true

