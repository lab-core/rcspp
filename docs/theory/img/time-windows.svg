<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Time windows: why the order of visits matters" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title>Time windows: why the order of visits matters</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs>
<rect x="0" y="0" width="760" height="400" rx="10" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="15" text-anchor="start" fill="#1b1b1b" font-weight="bold">Route 0 → 1 → 2 → 0′</text>
<text x="138.0" y="66.0" font-size="13" text-anchor="end" fill="#5f6b76" font-weight="normal">customer 1</text>
