<circle cx="290.0" cy="262" r="6" fill="#d9480f"/>
<text x="290.0" y="284.0" font-size="11" text-anchor="middle" fill="#d9480f" font-weight="bold">arrive 10</text>
<line x1="290.0" y1="262" x2="430.0" y2="262" stroke="#d9480f" stroke-width="3" stroke-dasharray="3 3"/>
<text x="360.0" y="250.0" font-size="11" text-anchor="middle" fill="#d9480f" font-weight="normal">wait until 20</text>
<circle cx="486.0" cy="232" r="6" fill="#c92a2a"/>
<text x="486.0" y="254.0" font-size="11" text-anchor="middle" fill="#c92a2a" font-weight="bold">arrive 24 > 15</text>
<text x="740.0" y="200.0" font-size="14" text-anchor="end" fill="#c92a2a" font-weight="bold">✗ infeasible at customer 1</text>
<line x1="150.0" y1="370" x2="710.0" y2="370" stroke="#1b1b1b" stroke-width="1.2"/>
<line x1="150.0" y1="370" x2="150.0" y2="375" stroke="#1b1b1b"/>
<text x="150.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">0</text>
<line x1="220.0" y1="370" x2="220.0" y2="375" stroke="#1b1b1b"/>
<text x="220.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">5</text>
<line x1="290.0" y1="370" x2="290.0" y2="375" stroke="#1b1b1b"/>
<text x="290.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">10</text>
<line x1="360.0" y1="370" x2="360.0" y2="375" stroke="#1b1b1b"/>
<text x="360.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">15</text>
<line x1="430.0" y1="370" x2="430.0" y2="375" stroke="#1b1b1b"/>
<text x="430.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">20</text>
<line x1="500.0" y1="370" x2="500.0" y2="375" stroke="#1b1b1b"/>
<text x="500.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">25</text>
<line x1="570.0" y1="370" x2="570.0" y2="375" stroke="#1b1b1b"/>
<text x="570.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">30</text>
<line x1="640.0" y1="370" x2="640.0" y2="375" stroke="#1b1b1b"/>
<text x="640.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">35</text>
<line x1="710.0" y1="370" x2="710.0" y2="375" stroke="#1b1b1b"/>
<text x="710.0" y="390.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">40</text>
<text x="138.0" y="375.0" font-size="13" text-anchor="end" fill="#5f6b76" font-weight="normal">time</text>
</svg>
