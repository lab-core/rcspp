<text x="255.0" y="67.0" font-size="11" text-anchor="middle" fill="#1a6b9a" font-weight="normal">[0, 15]</text>
<text x="138.0" y="96.0" font-size="13" text-anchor="end" fill="#5f6b76" font-weight="normal">customer 2</text>
<line x1="150.0" y1="92" x2="710.0" y2="92" stroke="#e3e8ec" stroke-width="1"/>
<rect x="430.0" y="84" width="140.0" height="16" rx="3" fill="#e7f5ff" stroke="#1a6b9a" stroke-width="1.6"/>
<text x="500.0" y="97.0" font-size="11" text-anchor="middle" fill="#1a6b9a" font-weight="normal">[20, 30]</text>
<text x="138.0" y="126.0" font-size="13" text-anchor="end" fill="#5f6b76" font-weight="normal">customer 3</text>
<line x1="150.0" y1="122" x2="710.0" y2="122" stroke="#e3e8ec" stroke-width="1"/>
<rect x="290.0" y="114" width="112.0" height="16" rx="3" fill="#e7f5ff" stroke="#1a6b9a" stroke-width="1.6"/>
