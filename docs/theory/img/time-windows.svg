<text x="740.0" y="30.0" font-size="14" text-anchor="end" fill="#2b8a3e" font-weight="bold">✓ feasible, back at the depot at 30</text>
<text x="20.0" y="200.0" font-size="15" text-anchor="start" fill="#1b1b1b" font-weight="bold">Route 0 → 2 → 1 → 0′</text>
<text x="138.0" y="236.0" font-size="13" text-anchor="end" fill="#5f6b76" font-weight="normal">customer 1</text>
<line x1="150.0" y1="232" x2="710.0" y2="232" stroke="#e3e8ec" stroke-width="1"/>
