<text x="500.0" y="267.0" font-size="11" text-anchor="middle" fill="#1a6b9a" font-weight="normal">[20, 30]</text>
<text x="138.0" y="296.0" font-size="13" text-anchor="end" fill="#5f6b76" font-weight="normal">customer 3</text>
<line x1="150.0" y1="292" x2="710.0" y2="292" stroke="#e3e8ec" stroke-width="1"/>
<rect x="290.0" y="284" width="112.0" height="16" rx="3" fill="#e7f5ff" stroke="#1a6b9a" stroke-width="1.6"/>
