<line x1="430.0" y1="262" x2="430.0" y2="267" stroke="#1b1b1b"/>
<text x="430.0" y="282.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">18</text>
<text x="20.0" y="312.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="normal">"Lower time is better" says A dominates B (cheaper and earlier), so B is discarded, but only B could continue.</text>
