<text x="365.0" y="160.0" font-size="11" text-anchor="middle" fill="#1a6b9a" font-weight="normal">[15, 16]</text>
<line x1="281.0" y1="180.0" x2="370.0" y2="180.0" stroke="#1b1b1b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
