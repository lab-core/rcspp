<text x="20.0" y="115.0" font-size="12" text-anchor="start" fill="#5f6b76" font-weight="normal">cost 5, time 10</text>
<rect x="352.0" y="76" width="26.0" height="28" rx="3" fill="#e7f5ff" stroke="#1a6b9a" stroke-width="1.6"/>
<text x="365.0" y="70.0" font-size="11" text-anchor="middle" fill="#1a6b9a" font-weight="normal">[15, 16]</text>
<line x1="229.0" y1="90.0" x2="318.0" y2="90.0" stroke="#1b1b1b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
