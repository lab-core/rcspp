<text x="394.0" y="95.0" font-size="13" text-anchor="start" fill="#c92a2a" font-weight="bold">arrives 14: ✗ too early</text>
<text x="20.0" y="185.0" font-size="15" text-anchor="start" fill="#1b1b1b" font-weight="bold">label B</text>
<text x="20.0" y="205.0" font-size="12" text-anchor="start" fill="#5f6b76" font-weight="normal">cost 6, time 12</text>
