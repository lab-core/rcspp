<line x1="326.0" y1="262" x2="326.0" y2="267" stroke="#1b1b1b"/>
<text x="326.0" y="282.0" font-size="12" text-anchor="middle" fill="#5f6b76" font-weight="normal">14</text>
<line x1="352.0" y1="262" x2="352.0" y2="267" stroke="#1b1b1b"/>
