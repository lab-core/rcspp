<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Branch-and-price tree for the toy instance" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title>Branch-and-price tree for the toy instance</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs>
<rect x="0" y="0" width="860" height="470" rx="10" fill="#ffffff"/>
<rect x="230.0" y="20" width="400" height="100" rx="10" fill="#eef6fc" stroke="#1a6b9a" stroke-width="2"/>
<text x="430.0" y="46.0" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">Root node: column generation</text>
<text x="430.0" y="67.0" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="normal">LP = 37.5   (x₁₂ = x₁₃ = x₃₂ = ½)</text>
<text x="430.0" y="88.0" font-size="13" text-anchor="middle" fill="#d9480f" font-weight="normal">flow on arc 1 → 2 = ½   →   branch on it</text>
<text x="430.0" y="109.0" font-size="13" text-anchor="middle" fill="#5f6b76" font-weight="normal">global bounds: 37.5 ≤ optimum ≤ ?</text>
<rect x="35.0" y="250" width="360" height="121" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
<text x="215.0" y="276.0" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">Branch A: arc 1 → 2 forced (flow = 1)</text>
<text x="215.0" y="297.0" font-size="13" text-anchor="middle" fill="#5f6b76" font-weight="normal">remove 1 → 3, 1 → 0′, 0 → 2, 3 → 2</text>
<text x="215.0" y="318.0" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="normal">column generation again:  LP = 44</text>
<text x="215.0" y="339.0" font-size="13" text-anchor="middle" fill="#2b8a3e" font-weight="normal">integer: routes 0→1→2→0′ + 0→3→0′</text>
<text x="215.0" y="360.0" font-size="13" text-anchor="middle" fill="#2b8a3e" font-weight="normal">new best plan: 44</text>
<rect x="465.0" y="250" width="360" height="121" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4"/>
<text x="645.0" y="276.0" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">Branch B: arc 1 → 2 forbidden (flow = 0)</text>
<text x="645.0" y="297.0" font-size="13" text-anchor="middle" fill="#5f6b76" font-weight="normal">remove 1 → 2</text>
<text x="645.0" y="318.0" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="normal">column generation again:  LP = 45</text>
<text x="645.0" y="339.0" font-size="13" text-anchor="middle" fill="#c92a2a" font-weight="normal">45 ≥ best plan 44  →  prune</text>
<text x="645.0" y="360.0" font-size="13" text-anchor="middle" fill="#5f6b76" font-weight="normal">(it is integer too, but worse)</text>
<line x1="330.0" y1="120.0" x2="216.3" y2="248.5" stroke="#1b1b1b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<line x1="530.0" y1="120.0" x2="643.7" y2="248.5" stroke="#1b1b1b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="430.0" y="450.0" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">Both branches explored, no open node left: 44 is proven optimal (lower bound = upper bound = 44).</text>
</svg>
