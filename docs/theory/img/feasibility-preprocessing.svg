<text x="360.0" y="406.0" font-size="13" text-anchor="middle" fill="#d9480f" font-weight="normal">Customer 2 opens at 20 (window [20, 30]), so no path is ever at 2 before time 20.</text>
<text x="360.0" y="428.0" font-size="13" text-anchor="middle" fill="#c92a2a" font-weight="normal">2 → 1 arrives at 24 or later, but 1 closes at 15   ·   2 → 3 arrives at 26 or later, but 3 closes at 18</text>
<text x="360.0" y="452.0" font-size="13" text-anchor="middle" fill="#5f6b76" font-weight="normal">No path can ever use these arcs, whatever the duals, so they are removed before the search starts.</text>
