<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 718" width="760" height="718" role="img" aria-label="Label tree for the pricing problem with time windows" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title>Label tree for the pricing problem with time windows</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs>
<rect x="0" y="0" width="760" height="718" rx="10" fill="#ffffff"/>
<text x="20.0" y="26.0" font-size="12" text-anchor="start" fill="#5f6b76" font-weight="normal">Each box is a label: path so far  (reduced cost, time, load), drawn under its predecessor. Processing is first in, first out.</text>
