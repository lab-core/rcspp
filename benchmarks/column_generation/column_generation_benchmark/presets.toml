# The building blocks every benchmark can name, and the options of a run unless a file or the
# command line sets them. A user's file has the same format: definitions under a block's name,
# then [defaults]. A run's own files hold the expanded values, so changing a preset here does not
# change how a recorded run runs again.

[defaults]
layer = "package"
master = "highspy"
pricing = "exact"
start = "artificial"
graph = {}
column_generation = {}
statistics = {}

# MARK: Pricing

# The exact search alone: every iteration ends with a proof. Other presets are added once agreed on
# with the users of the benchmark; a file can define its own, such as a capped heuristic stage first.
[pricing.exact]
stages = [{ algorithm = "simple" }]
