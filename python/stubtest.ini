# mypy settings for checking the stubs of rcspp._core against the extension:
#   PYTHONPATH=python/src python -m mypy.stubtest rcspp._core --mypy-config-file python/stubtest.ini
[mypy]

# A resource graph's add_arc takes the arc's resource consumption first, so it does not have
# the signature of the Graph.add_arc it overrides.
[mypy-rcspp._core.graph]
disable_error_code = override
